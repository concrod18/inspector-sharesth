version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: inspector
      POSTGRES_PASSWORD: inspector_secure_password
      POSTGRES_DB: inspector_sharesth
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspector"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://inspector:inspector_secure_password@postgres:5432/inspector_sharesth
      SECRET_KEY: your-secret-key-change-in-production
      ALGORITHM: HS256
      JWT_EXPIRATION_HOURS: 24
      DEBUG: "false"
    ports:
      - "8000:8000"
    volumes:
      - ./screenshots:/app/storage/screenshots
      - ./reports:/app/storage/reports
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://backend:8000/api
      VITE_WS_URL: ws://backend:8000/ws
    ports:
      - "3000:3000"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

networks:
  default:
    name: inspector-network
